# Single source of truth for the runtime — used by local dev, Docker, and CI.
# Add every dependency a notebook imports here. Local "kitchen-sink" envs
# (e.g. pangeo) hide missing deps; CI builds strictly from this file and will
# silently produce empty notebook cells if anything is missing.
#
# pixi.lock (committed alongside this file) pins every package to an exact
# build hash per platform. Regenerate it with `pixi install` after editing
# this file; commit both files in the same commit.

[workspace]
name = "marine-heatwave-replication"
# bioconda hosts snakemake (and downstream rule-engine ecosystem); conda-forge
# is the priority channel for everything else.
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
# --- core scientific stack ---
numpy = "*"
pandas = ">=2.0"
xarray = ">=2024.6"
scipy = "*"
matplotlib = "*"
pyarrow = "*"
# Pillow downscales + base64-inlines the headline figure into the reader-facing
# story page (scripts/build_story.py), so the generated HTML is self-contained.
pillow = "*"
# --- notebook execution + Jupyter Book ---
jupytext = "*"
jupyterlab = "*"
nbclient = "*"
ipykernel = "*"
# --- pipeline driver ---
snakemake = "*"
# --- deps this replication needs ---
# NetCDF/Zarr I/O for the intermediate + result artefacts (never .npz — see DOMAIN.md).
netcdf4 = "*"
zarr = "*"
# Out-of-core: the SST_cci archive is ~212 GB at native resolution for 1982-2016,
# so 03_analysis streams spatial blocks lazily rather than materialising the cube.
dask = "*"
# Copernicus Marine Service — serves ESA SST CCI Analysis v3.0 as ARCO/Zarr with
# pre-downsampled variants, which is why we pull from CMEMS rather than the CEDA
# HTTP archive. See notebooks/01_data_download.py for the provenance note.
copernicusmarine = "*"
# fsspec HTTP backend — required to open the CMEMS ARCO Zarr stores over https.
# Without both of these, xr.open_zarr on an https:// URL raises
# "HTTPFileSystem requires requests and aiohttp to be installed".
aiohttp = "*"
requests = "*"
# Coastline/graticule for the spatial diagnostic map in 04_figures.
cartopy = "*"

# Pip-only deps go in [pypi-dependencies]. Conda-forge is preferred where available.
[pypi-dependencies]
# XMHW — xarray implementation of the Hobday et al. (2016) MHW definition, by
# Petrelli (CLEX/coecms), author-disjoint from Oliver et al. This is the
# INDEPENDENT detection engine that makes this a Replication (not Reproduction)
# Study. Not on conda-forge or PyPI, so it is installed from git.
#
# Pinned to a COMMIT, not to `master`. `rev = "master"` tracked a moving branch:
# pixi.lock held the resolved commit, so an existing checkout stayed
# reproducible, but the next re-lock would silently swap the detection engine
# for whatever master had become — for the one dependency whose exact behaviour
# the replication's result depends on.
#
# This commit is tag 1.0.0 (verified identical to master, 2026-08-13).
# Archived at swh:1:rev:1006312ae693e8aef8bd3706b9afb431eca564a5 — the SWHID is
# the only persistent identifier for it, because XMHW's Zenodo deposits stop at
# 0.9.2 (concept DOI 10.5281/zenodo.5112732) and 1.0.0 was never deposited.
# See the `references:` entry in CITATION.cff.
xmhw = { git = "https://github.com/coecms/xmhw.git", rev = "1006312ae693e8aef8bd3706b9afb431eca564a5" }

[feature.docs.dependencies]
mystmd = "*"

[feature.tests.dependencies]
pytest = "*"
# ruamel.yaml round-trips YAML *with* its comments. scripts/set_release_identifiers.py
# rewrites CITATION.cff in place, and pyyaml would silently delete every
# explanatory comment in it.
"ruamel.yaml" = "*"
# rdflib parses the nanopub TEMPLATE TriG that IS the schema for each FORRT chain
# step. scripts/template_fields.py extracts the field spec from it; the offline
# tests and scripts/check_template_drift.py both need it. See nanopubs/templates/.
rdflib = "*"

[environments]
default = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
tests = { features = ["tests"], solve-group = "default" }

[tasks]
run = "snakemake --cores 1"
book = "myst build --html"
lab = "jupyter lab"

# The `tests` feature and environment already existed here; nothing declared a
# task and no workflow ever invoked pytest, so it was scaffolding that had never
# run. Wired into ci.yml.
#   pixi run -e tests test
[feature.tests.tasks]
test = "pytest tests/ -q"
# Verifies every notebooks/*.py has a committed .ipynb that is executed AND
# still matches it. The book renders those committed notebooks instead of
# executing the ~8 core-hour pipeline in CI, so this is what stops it from
# silently serving results produced by code that no longer exists.
# See docs/cicd-conventions.md § Executing notebooks in CI, or committing them.
check-notebooks = "python scripts/check_notebook_sync.py"

# --- verification checks behind specific claims in the Outcome ---------------
# Each of these produces a number that the Replication Outcome states, so they
# live here rather than in a scratch directory: a claim whose supporting check
# cannot be re-run is not evidence. See docs/verification-checks.md.
#
# Does the 93.3% longitude coverage bias the headline? (limitations)
check-coverage = "python scripts/check_coverage_sensitivity.py"
# Are the figure colours legible under colour-vision deficiency? (figure design)
check-colors = "python scripts/check_colorblind_safe.py"
# Do two complete runs produce the same numbers? (reproducibility caveat)
compare-runs = "python scripts/compare_runs.py"
# Compares the live FORRT templates against nanopubs/templates/fields.snapshot.json.
# Networked, so NOT in the per-PR gate — run on demand or on schedule
# (.github/workflows/template-drift.yml). `--update` re-vendors the snapshot.
check-templates = "python scripts/check_template_drift.py"
# Builds nanopubs/chain-draft.json (the pre-filled hand-off for the Science Live
# FORRT-chain wizard) from CITATION.cff + the drafts + PUBLISHED.md. Offline, no
# Claude. See docs/chain-draft-contract.md. Run after drafting, then commit the file.
build-chain-draft = "python scripts/build_chain_draft.py"
sync-drafts = "python scripts/sync_draft_skeletons.py"
# Generates the reader-facing story page (blog/index.html) from the PUBLISHED
# chain: fetches the constellation for the apex in nanopubs/PUBLISHED.md (the
# Research Synthesis if published, else the Replication Outcome) and renders a
# self-contained HTML article — nothing invented, every value from the signed
# nanopubs. Needs SCIENCELIVE_API_KEY. Deterministic: commit blog/ and publish
# it wherever the repo already publishes (e.g. GitHub Pages). See docs/story-page.md.
build-story = "python scripts/build_story.py"
